# 头像配置
sidebar:
  avatar: lan.png   # 因为文件在 source/_data/assets/ 下，直接写文件名即可

# 网站图标配置
icon:
  favicon: "/favicon.ico"
  apple_touch_icon: "/apple-touch-icon.png"  # 如果有的话

# 主页顶部标题
alternate: LanKing

# 导航菜单（取消注释并修改）
