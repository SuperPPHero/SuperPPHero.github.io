# 社交链接
social:
  GitHub主页: https://github.com/SuperPPHero || github || "#586069"
  B站空间: https://space.bilibili.com/393782280 || bilibili || "#fb7299"
  music: https://music.163.com/#/user/home?id=12592093314 || cloud-music || "#e60026"
  # 邮箱等

# 暗色模式
darkmode: true
auto_dark:
  enable: true
  start: 20
  end: 7

# 歌单分享
nyxPlayer:
  enable: true        # 启用播放器
  preset: "shokax"    # 播放器风格，保持默认即可
  urls:               # 歌单列表
    - name: "网易云歌单"   # 歌单显示名称，可以随意修改
      url: "https://music.163.com/m/playlist?id=18306246258"

# 搜索
pagefind:
  enable: true